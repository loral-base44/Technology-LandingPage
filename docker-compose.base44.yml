services:
  web:
    image: node:16
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm start"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_PORT=0
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 300s

volumes:
  node_modules:
